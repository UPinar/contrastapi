name: WHOIS terms

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the terms with the snapshots
        run: python3 -I tests/whois_terms/check.py
